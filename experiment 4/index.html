<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
<form action="#" align="center">
         <h1>Hotel Room Booking Form</h1>
             <label for="name" >Full Name :</label>
             <input type="text" placeholder="Full name" id="name" name="name" required>
        <br>
        <br> 
            <label for="email">Email :</label>
            <input type="email" placeholder="enter email" name="email" id="email" required>
        <br>
        <br>
            <label for="phone">Phone :</label>
            <input type="tel" name="phone" id="phone" placeholder="enter phone number" required>
        <br>
        <br>
            <label for="checkindate">Check-in date :</label>
            <input type="date" id="checkindate" name="date" required>
        <br>
        <br>
            <label for="check-out date">check-out date :</label>    
            <input type="date" id="check-out date" required>
        <br>
        <br>
            <label for="room type">select roome type :</label>
            <select name="room type" id="room type" required>
                <option value="" selected disabled >--room type--</option>
                <option value="single">single room</option>
                <option value="double">double room</option>
                <option value="deluxe">deluxe room</option>
                <option value="suite">suite</option>
            </select>
        <br>
        <br>
        <label for="guest">Number Of Guests :</label>
        <input type="number" id="guest" name="guest" placeholder="no. of guests" required min="1">
        <br>
        <br>
        <label for="request">Special Request :</label>
        <br>
        <textarea name="request" id="request" cols="50" rows="5"></textarea>
        <br>
        <br>
        <button  type="submit">Book Now</button>
        <button type="reset">Reset Form</button>
</form>
    </body>
</html>
